<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plume Collective</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase Realtime Database SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8hpGlw5KAiH3RHwJ3m3HrT5wkitlesJ4",
      authDomain: "plume-collective-65c04.firebaseapp.com",
      databaseURL: "https://plume-collective-65c04-default-rtdb.firebaseio.com",
      projectId: "plume-collective-65c04",
      storageBucket: "plume-collective-65c04.firebasestorage.app",
      messagingSenderId: "779680056777",
      appId: "1:779680056777:web:8d24dbb856070d67929418"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.rtdb = db;
    window.rtdbRef = ref;
    window.rtdbOnValue = onValue;
    window.rtdbSet = set;
  </script>
</head>
<body class="bg-slate-950 text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_LIVRES = [
      {
        id: 1,
        titre: "Les Chroniques de Proxima",
        synopsis: "À la lisière de la galaxie, une colonie humaine découvre une structure artificielle enfouie qui remet en question toute l'histoire de l'évolution.",
        createur: "Frédéric",
        coAuteurs: ["Sarah", "Marc"],
        statut: "en_cours",
        chapitres: [
          {
            id: 101,
            titre: "Chapitre 1 : Le Signal du Sous-Sol",
            lignes: [
              {
                id: 1001,
                auteur: "Frédéric",
                texte: "Les capteurs thermiques de la station enfouie sous les glaces de Proxima b s'affolèrent soudainement. Une pulsation rythmique, d'une régularité effrayante, émanait du forage 4.",
                illustration: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=500&auto=format&fit=crop",
                commentaires: [
                  { id: 1, auteur: "Sarah", texte: "Très bonne intro ! Peut-être accentuer le froid de la station ?" }
                ]
              }
            ]
          }
        ],
        discussionInterne: [
          { id: 1, auteur: "Frédéric", heure: "14:32", texte: "Salut l'équipe, j'ai posé les bases du premier chapitre !" }
        ]
      }
    ];

    function App() {
      const [livres, setLivres] = useState(INITIAL_LIVRES);
      const [utilisateurActif] = useState({ nom: "Frédéric" });
      const [livreSelectionneId, setLivreSelectionneId] = useState(1);
      const [chapitreSelectionneId, setChapitreSelectionneId] = useState(101);
      const [ligneActive, setLigneActive] = useState(null);
      const [ongletActif, setOngletActif] = useState('relecture');
      const [statutFirebase, setStatutFirebase] = useState('Connexion...');

      const [texteNouveauParagraphe, setTexteNouveauParagraphe] = useState('');
      const [texteCommentaire, setTexteCommentaire] = useState('');
      const [nouveauMessageInterne, setNouveauMessageInterne] = useState('');
      
      const [texteEnCoursDEdition, setTexteEnCoursDEdition] = useState('');
      const [urlImageEnCours, setUrlImageEnCours] = useState('');
      const [erreurEdition, setErreurEdition] = useState('');

      // Synchronisation Realtime Database
      useEffect(() => {
        const checkInterval = setInterval(() => {
          if (window.rtdb && window.rtdbRef && window.rtdbOnValue) {
            clearInterval(checkInterval);
            const livresRef = window.rtdbRef(window.rtdb, 'projets/plume_main/livres');
            
            window.rtdbOnValue(livresRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                setLivres(data);
                setStatutFirebase('Synchronisé');
              } else {
                window.rtdbSet(livresRef, INITIAL_LIVRES);
                setStatutFirebase('Base initialisée');
              }
            }, (error) => {
              console.error(error);
              setStatutFirebase('Erreur de connexion');
            });
          }
        }, 300);

        return () => clearInterval(checkInterval);
      }, []);

      const sauvegarderSurFirebase = (nouveauxLivres) => {
        setLivres(nouveauxLivres);
        if (window.rtdb && window.rtdbRef && window.rtdbSet) {
          setStatutFirebase('Sauvegarde...');
          const livresRef = window.rtdbRef(window.rtdb, 'projets/plume_main/livres');
          window.rtdbSet(livresRef, nouveauxLivres)
            .then(() => setStatutFirebase('Enregistré !'))
            .catch(() => setStatutFirebase('Erreur sauvegarde'));
        }
      };

      useEffect(() => {
        const livre = livres.find(l => l.id === livreSelectionneId);
        if (livre && livre.chapitres && livre.chapitres.length > 0) {
          setChapitreSelectionneId(livre.chapitres[0].id);
        } else {
          setChapitreSelectionneId(null);
        }
        setLigneActive(null);
      }, [livreSelectionneId]);

      const livreActif = livres.find(l => l.id === livreSelectionneId);
      const chapitreActif = livreActif?.chapitres?.find(c => c.id === chapitreSelectionneId);

      const gererSelectionLigne = (ligne) => {
        setLigneActive(ligne);
        setTexteEnCoursDEdition(ligne.texte);
        setUrlImageEnCours(ligne.illustration || '');
        setErreurEdition('');
      };

      const ajouterParagraphe = (e) => {
        e.preventDefault();
        if (!texteNouveauParagraphe.trim() || !chapitreActif) return;

        const nouvelleLigne = {
          id: Date.now(),
          auteur: utilisateurActif.nom,
          texte: texteNouveauParagraphe.trim(),
          illustration: "",
          commentaires: []
        };

        const maj = livres.map(l => {
          if (l.id !== livreSelectionneId) return l;
          return {
            ...l,
            chapitres: (l.chapitres || []).map(c => {
              if (c.id !== chapitreSelectionneId) return c;
              return { ...c, lignes: [...(c.lignes || []), nouvelleLigne] };
            })
          };
        });

        sauvegarderSurFirebase(maj);
        setTexteNouveauParagraphe('');
      };

      const sauvegarderModification = (e) => {
        e.preventDefault();
        if (!texteEnCoursDEdition.trim() || !ligneActive) return;

        if (texteEnCoursDEdition.trim().length < 10) {
          setErreurEdition("Le texte doit faire au moins 10 caractères.");
          return;
        }

        const maj = livres.map(l => {
          if (l.id !== livreSelectionneId) return l;
          return {
            ...l,
            chapitres: (l.chapitres || []).map(c => {
              if (c.id !== chapitreSelectionneId) return c;
              return {
                ...c,
                lignes: (c.lignes || []).map(line => {
                  if (line.id !== ligneActive.id) return line;
                  return { 
                    ...line, 
                    texte: texteEnCoursDEdition.trim(),
                    illustration: urlImageEnCours.trim()
                  };
                })
              };
            })
          };
        });

        sauvegarderSurFirebase(maj);
        setErreurEdition('');
      };

      const ajouterCommentaire = (e) => {
        e.preventDefault();
        if (!texteCommentaire.trim() || !ligneActive) return;

        const nouveauCom = {
          id: Date.now(),
          auteur: utilisateurActif.nom,
          texte: texteCommentaire.trim()
        };

        const maj = livres.map(l => {
          if (l.id !== livreSelectionneId) return l;
          return {
            ...l,
            chapitres: (l.chapitres || []).map(c => {
              if (c.id !== chapitreSelectionneId) return c;
              return {
                ...c,
                lignes: (c.lignes || []).map(line => {
                  if (line.id !== ligneActive.id) return line;
                  return { ...line, commentaires: [...(line.commentaires || []), nouveauCom] };
                })
              };
            })
          };
        });

        sauvegarderSurFirebase(maj);
        setTexteCommentaire('');
      };

      const resoudreCommentaire = (commentaireId) => {
        if (!ligneActive) return;

        const maj = livres.map(l => {
          if (l.id !== livreSelectionneId) return l;
          return {
            ...l,
            chapitres: (l.chapitres || []).map(c => {
              if (c.id !== chapitreSelectionneId) return c;
              return {
                ...c,
                lignes: (c.lignes || []).map(line => {
                  if (line.id !== ligneActive.id) return line;
                  return {
                    ...line,
                    commentaires: (line.commentaires || []).filter(com => com.id !== commentaireId)
                  };
                })
              };
            })
          };
        });

        sauvegarderSurFirebase(maj);
      };

      const envoyerMessageInterne = (e) => {
        e.preventDefault();
        if (!nouveauMessageInterne.trim() || !livreActif) return;

        const maintenant = new Date();
        const heureFormatee = `${maintenant.getHours().toString().padStart(2, '0')}:${maintenant.getMinutes().toString().padStart(2, '0')}`;

        const nouveauMsg = {
          id: Date.now(),
          auteur: utilisateurActif.nom,
          heure: heureFormatee,
          texte: nouveauMessageInterne.trim()
        };

        const maj = livres.map(l => {
          if (l.id !== livreSelectionneId) return l;
          return { ...l, discussionInterne: [...(l.discussionInterne || []), nouveauMsg] };
        });

        sauvegarderSurFirebase(maj);
        setNouveauMessageInterne('');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
          <header className="border-b border-slate-850 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-2xl">✒️</span>
              <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 via-orange-400 to-amber-600 bg-clip-text text-transparent uppercase">
                Plume Collective
              </h1>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-[10px] bg-slate-800 text-amber-400 px-2.5 py-1 rounded-full border border-slate-700 font-mono">
                {statutFirebase}
              </span>
              <div className="flex items-center gap-2 bg-slate-950/60 border border-slate-800 px-4 py-1.5 rounded-full">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-xs font-semibold text-slate-300 tracking-wide uppercase">Auteur : {utilisateurActif.nom}</span>
              </div>
            </div>
          </header>

          <div className="max-w-[1600px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
            
            {/* BIBLIOTHÈQUE */}
            <div className="space-y-4 text-left">
              <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2 px-1">Bibliothèque</h2>
              <div className="space-y-2.5">
                {livres.map(livre => (
                  <button
                    key={livre.id}
                    onClick={() => setLivreSelectionneId(livre.id)}
                    className={`w-full p-4 rounded-2xl border transition-all duration-200 text-left flex flex-col gap-2 cursor-pointer
                      ${livreSelectionneId === livre.id 
                        ? 'bg-gradient-to-br from-slate-900 to-slate-850 border-amber-500/40 shadow-lg' 
                        : 'bg-slate-900/40 border-slate-850 hover:bg-slate-900/70'}
                    `}
                  >
                    <div className="flex justify-between items-start gap-2">
                      <h3 className={`text-sm font-bold ${livreSelectionneId === livre.id ? 'text-amber-400' : 'text-slate-200'}`}>
                        {livre.titre}
                      </h3>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider
                        ${livre.statut === 'termine' ? 'bg-emerald-950/60 text-emerald-400' : 'bg-amber-950/60 text-amber-400'}
                      `}>
                        {livre.statut === 'termine' ? 'Clos' : 'En cours'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed">{livre.synopsis}</p>
                    <div className="flex flex-wrap gap-1 items-center pt-1 text-[10px] text-slate-500">
                      <span className="text-amber-500/80 font-bold">👑 {livre.createur}</span>
                      {(livre.coAuteurs || []).map(a => <span key={a} className="before:content-['•'] before:mx-1"> {a}</span>)}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* SOMMAIRE */}
            <div className="space-y-4 text-left">
              <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2 px-1">Sommaire</h2>
              {livreActif && (
                <div className="bg-slate-900 rounded-2xl border border-slate-850 p-3 space-y-1.5 shadow-xl">
                  {(livreActif.chapitres || []).map(chapitre => (
                    <button
                      key={chapitre.id}
                      onClick={() => setChapitreSelectionneId(chapitre.id)}
                      className={`w-full px-4 py-3 rounded-xl text-left text-xs font-semibold transition-all cursor-pointer flex items-center justify-between
                        ${chapitreSelectionneId === chapitre.id ? 'bg-amber-600 text-white' : 'text-slate-300 hover:bg-slate-850'}
                      `}
                    >
                      <span className="truncate">{chapitre.titre}</span>
                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-950 text-slate-400">{(chapitre.lignes || []).length} §</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* MANUSCRIT */}
            <div className="space-y-6 text-left">
              <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 px-1">Manuscrit</h2>
              <div className="bg-slate-900 rounded-2xl border border-slate-850 p-6 shadow-xl min-h-[400px] flex flex-col justify-between gap-6">
                <div className="space-y-6 flex-1">
                  {chapitreActif && chapitreActif.lignes && chapitreActif.lignes.length > 0 ? (
                    chapitreActif.lignes.map((ligne) => (
                      <div 
                        key={ligne.id}
                        onClick={() => gererSelectionLigne(ligne)}
                        className={`rounded-xl transition-all p-3 -mx-3 cursor-pointer border border-transparent
                          ${ligneActive?.id === ligne.id ? 'bg-slate-950 border-slate-800' : 'hover:bg-slate-950/40'}
                        `}
                      >
                        <p className="text-slate-200 font-serif text-[15px] leading-relaxed break-words">{ligne.texte}</p>
                        <div className="mt-2 flex justify-between text-[10px]">
                          <span className="font-semibold text-amber-500/80">✍️ {ligne.auteur}</span>
                          <div className="flex gap-2 text-slate-500">
                            {ligne.illustration && <span>🖼️ Illustré</span>}
                            {ligne.commentaires && ligne.commentaires.length > 0 && (
                              <span className="text-amber-500/70 font-bold">💬 {ligne.commentaires.length}</span>
                            )}
                          </div>
                        </div>
                        {ligne.illustration && (
                          <div className="mt-3 rounded-lg overflow-hidden border border-slate-850 max-h-40 bg-slate-950">
                            <img src={ligne.illustration} alt="Illustration" className="w-full h-full object-cover opacity-80" onError={(e) => e.target.style.display = 'none'} />
                          </div>
                        )}
                      </div>
                    ))
                  ) : (
                    <p className="text-xs text-slate-500 italic font-serif py-12 text-center">Le manuscrit est encore vierge.</p>
                  )}
                </div>
              </div>

              {chapitreActif && (
                <section className="bg-slate-900 rounded-2xl border border-slate-850 p-5 shadow-xl">
                  <form onSubmit={ajouterParagraphe} className="space-y-3">
                    <textarea
                      rows="4"
                      value={texteNouveauParagraphe}
                      onChange={(e) => setTexteNouveauParagraphe(e.target.value)}
                      placeholder="Rédigez le paragraphe suivant..." 
                      className="w-full px-4 py-3 bg-slate-950 border border-slate-850 rounded-xl text-slate-100 font-serif text-sm outline-none focus:border-amber-500"
                    />
                    <div className="flex justify-end">
                      <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded-xl text-xs cursor-pointer">
                        Ajouter au manuscrit
                      </button>
                    </div>
                  </form>
                </section>
              )}
            </div>

            {/* OUTILS COLLABORATIFS */}
            <div className="space-y-6 text-left">
              <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 px-1">Outils Collaboratifs</h2>
              <div className="bg-slate-900 rounded-2xl border border-slate-850 shadow-xl overflow-hidden flex flex-col h-[580px]">
                <div className="flex border-b border-slate-850 bg-slate-950/40">
                  <button onClick={() => setOngletActif('relecture')} className={`flex-1 py-3 text-center text-xs font-bold uppercase ${ongletActif === 'relecture' ? 'text-amber-500 border-b-2 border-amber-500 bg-slate-900/40' : 'text-slate-400'}`}>
                    🔎 Relecture
                  </button>
                  <button onClick={() => setOngletActif('chat_interne')} className={`flex-1 py-3 text-center text-xs font-bold uppercase ${ongletActif === 'chat_interne' ? 'text-amber-500 border-b-2 border-amber-500 bg-slate-900/40' : 'text-slate-400'}`}>
                    💬 Notes
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {ongletActif === 'relecture' ? (
                    <>
                      {ligneActive ? (
                        <div className="space-y-4">
                          <div className="border-b border-slate-850 pb-2">
                            <p className="text-[10px] uppercase font-bold text-slate-500">Paragraphe de {ligneActive.auteur}</p>
                          </div>

                          <form onSubmit={sauvegarderModification} className="space-y-3 bg-slate-950/40 p-3 rounded-xl border border-slate-850">
                            <textarea rows="3" value={texteEnCoursDEdition} onChange={(e) => setTexteEnCoursDEdition(e.target.value)} className="w-full text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg font-serif" />
                            <input type="text" placeholder="URL de l'image..." value={urlImageEnCours} onChange={(e) => setUrlImageEnCours(e.target.value)} className="w-full text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg" />
                            {erreurEdition && <p className="text-rose-400 text-[10px]">{erreurEdition}</p>}
                            <button type="submit" className="w-full bg-slate-800 text-slate-200 text-[11px] py-1.5 rounded-lg">Mettre à jour</button>
                          </form>

                          <div className="space-y-2">
                            <p className="text-[10px] uppercase font-bold text-slate-500">Commentaires</p>
                            {(ligneActive.commentaires || []).map(com => (
                              <div key={com.id} className="text-xs bg-slate-950/60 p-3 rounded-xl border border-slate-850 relative group">
                                <p className="font-bold text-amber-500/90 text-[10px]">{com.auteur}</p>
                                <p className="text-slate-300">{com.texte}</p>
                                <button onClick={() => resoudreCommentaire(com.id)} className="absolute top-2 right-2 text-[10px] text-slate-500 hover:text-rose-400">✕</button>
                              </div>
                            ))}
                          </div>

                          <form onSubmit={ajouterCommentaire} className="space-y-2 pt-2 border-t border-slate-850">
                            <textarea rows="2" placeholder="Ajouter une remarque..." value={texteCommentaire} onChange={(e) => setTexteCommentaire(e.target.value)} className="w-full text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg" />
                            <button type="submit" className="w-full bg-slate-800 text-slate-200 text-[11px] py-1.5 rounded-lg">Poster</button>
                          </form>
                        </div>
                      ) : (
                        <p className="text-slate-500 text-xs italic text-center py-8">Sélectionnez un paragraphe pour interagir.</p>
                      )}
                    </>
                  ) : (
                    <div className="flex flex-col h-full justify-between">
                      <div className="space-y-3 flex-1 overflow-y-auto mb-4">
                        {(livreActif?.discussionInterne || []).map(msg => (
                          <div key={msg.id} className="text-xs bg-slate-950/60 p-2.5 rounded-xl border border-slate-850">
                            <div className="flex justify-between text-[9px] text-slate-500 mb-0.5">
                              <span className="font-bold text-amber-500/90">{msg.auteur}</span>
                              <span>{msg.heure}</span>
                            </div>
                            <p className="text-slate-300">{msg.texte}</p>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={envoyerMessageInterne} className="flex gap-2 pt-3 border-t border-slate-850">
                        <input type="text" value={nouveauMessageInterne} onChange={(e) => setNouveauMessageInterne(e.target.value)} placeholder="Note aux co-auteurs..." className="flex-1 text-xs px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200" />
                        <button type="submit" className="bg-slate-800 text-slate-200 text-xs px-3 rounded-lg">→</button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
